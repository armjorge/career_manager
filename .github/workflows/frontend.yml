name: Frontend CI/CD

on:
  push:
    branches: [dev, prod]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

# Branch → GitHub Environment:
#   prod → prod  (career-app-prod-*)
#   dev  → dev   (career-app-dev-*)
#
# Required Environment secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                      (default us-east-1)
#   S3_BUCKET                      (e.g. career-app-dev-site — no s3:// prefix)
#   CLOUDFRONT_DISTRIBUTION_ID
#   VITE_API_BASE_URL              (…/api/v1)
#   VITE_COGNITO_USER_POOL_ID
#   VITE_COGNITO_USER_POOL_CLIENT_ID
#   VITE_COGNITO_DOMAIN            (hosted UI prefix, e.g. career-app-dev-auth)
#   VITE_AWS_REGION                (us-east-1)
# Optional:
#   VITE_ENABLE_AUTH               (default true)
#   VITE_ENABLE_GOOGLE_AUTH        (default false)
#   VITE_ENABLE_ANALYTICS          (default true)
#   VITE_POSTHOG_KEY
#   VITE_POSTHOG_HOST
#   VITE_APP_NAME

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        env:
          VITE_APP_NAME: Career Manager
          VITE_ENVIRONMENT: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.VITE_COGNITO_USER_POOL_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_ENABLE_AUTH: 'true'
          VITE_ENABLE_GOOGLE_AUTH: 'false'
          VITE_ENABLE_ANALYTICS: 'true'
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront Cache
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

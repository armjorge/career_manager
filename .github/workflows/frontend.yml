name: Frontend CI/CD

on:
  push:
    branches: [develop, main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [develop, main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

# Resolve environment name:
#   main branch (or manual target)  → prod
#   develop branch                  → dev
#
# When you have a second AWS account, update the secrets inside the
# 'prod' GitHub Environment — no workflow changes needed.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/ ${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"

name: Frontend CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  # Only trigger if files in the frontend folder change
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Set the working directory so we don't have to 'cd frontend' in every step
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build React App (Quality Check)
        env:
          # Inject your environment variables during the build phase
          VITE_API_BASE_URL: ${{ secrets.VITE_DEV_API_BASE_URL }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_DEV_NEON_AUTH_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        # ONLY run this step if the event is a merge/push, NOT a pull request
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.event_name == 'push'
        # Adjust the bucket name here if you have a specific dev bucket (e.g., s3://career-app-frontend-dev/)
        run: aws s3 sync dist/ s3://career-app-frontend/ --delete
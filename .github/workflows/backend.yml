name: Backend CI/CD

on:
  push:
    branches: [dev, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Branch → GitHub Environment:
#   prod → prod  (career-app-prod-*)
#   dev  → dev   (career-app-dev-*)
#
# Required Environment secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                 (default us-east-1)
#   LAMBDA_FUNCTION_NAME      (e.g. career-app-dev-api)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv + Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install OS Dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Lambda Package
        run: |
          chmod +x ./backend/scripts/package.sh
          ./backend/scripts/package.sh

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to Lambda
        if: github.event_name != 'pull_request'
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://backend/dist/lambda.zip"
